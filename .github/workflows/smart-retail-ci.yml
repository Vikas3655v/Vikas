name: Smart Retail CI

on:
  push:
    paths:
      - 'projects/smart-retail-surveillance/**'
  pull_request:
    paths:
      - 'projects/smart-retail-surveillance/**'

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/smart-retail-surveillance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements.txt
      - run: python -m py_compile src/recommend.py src/analytics.py backend/app.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/smart-retail-surveillance/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: projects/smart-retail-surveillance/frontend/package.json
      - run: npm install
      - run: npm run build
